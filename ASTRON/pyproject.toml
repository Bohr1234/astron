[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astron-engine"
version = "1.0.0"
description = "An open-source Python engine for orbital mechanics and real-time trajectory simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "matplotlib>=3.0.0",
    "google-genai>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/yourusername/astron"